<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudflare Worker 管理器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
body{min-height:100vh;background:#0f0c29;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:20px;color:#c9d1d9;}
.app{max-width:900px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.header h1{font-size:22px;color:#fff;display:flex;align-items:center;gap:8px;}
.header h1 span{font-size:13px;color:#8b949e;font-weight:400;}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:#667eea;color:#fff;}
.btn-primary:hover{background:#5a6fd6;}
.btn-danger{background:#ef4444;color:#fff;}
.btn-danger:hover{background:#dc2626;}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.15);color:#c9d1d9;}
.btn-outline:hover{background:rgba(255,255,255,0.05);}
.btn-success{background:#238636;color:#fff;}
.btn-success:hover{background:#2ea043;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.card{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,0.06);margin-bottom:16px;}
.login-card{max-width:420px;margin:60px auto;text-align:center;}
.login-card h2{font-size:24px;color:#fff;margin-bottom:8px;}
.login-card p{color:#8b949e;font-size:14px;margin-bottom:24px;}
.login-card .btn{width:100%;padding:14px;font-size:16px;justify-content:center;}
.worker-list .worker-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:0.2s;}
.worker-list .worker-item:hover{background:rgba(255,255,255,0.02);padding-left:8px;margin-left:-8px;border-radius:8px;}
.worker-list .worker-item .name{color:#fff;font-size:15px;}
.worker-list .worker-item .status{font-size:12px;color:#8b949e;}
.worker-list .worker-item .badge{font-size:11px;padding:2px 10px;border-radius:10px;background:rgba(102,126,234,0.2);color:#667eea;}
.editor-area textarea{width:100%;min-height:300px;background:#0d1117;color:#c9d1d9;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;font-family:'Monaco','Menlo','Consolas',monospace;font-size:13px;line-height:1.7;resize:vertical;outline:none;transition:0.3s;}
.editor-area textarea:focus{border-color:#667eea;}
.editor-area .toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.editor-area .info{color:#8b949e;font-size:13px;margin-bottom:8px;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 28px;color:#f0f6fc;font-size:14px;opacity:0;transition:all 0.4s;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:#f85149;}
.toast.success{border-color:#238636;}
.loading{text-align:center;padding:40px;color:#8b949e;}
.hidden{display:none;}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
</style>
</head>
<body>

<div class="app">
  <!-- 头部 -->
  <div class="header">
    <h1>⚡ Worker 管理 <span>Cloudflare</span></h1>
    <div>
      <button class="btn btn-outline" id="logoutBtn" onclick="logout()" style="display:none;">🚪 退出</button>
    </div>
  </div>

  <!-- 登录卡片 -->
  <div class="card login-card" id="loginCard">
    <h2>🔐 登录 Cloudflare</h2>
    <p>使用 OAuth 授权登录，无需手动配置 Token</p>
    <button class="btn btn-primary" onclick="login()">🚀 登录</button>
    <div style="margin-top:12px;font-size:12px;color:#555;">授权后即可管理你的 Workers</div>
  </div>

  <!-- 主界面 -->
  <div id="mainPanel" class="hidden">
    <!-- Worker 列表 -->
    <div class="card" id="listCard">
      <div class="flex-between">
        <div style="font-size:16px;font-weight:500;color:#fff;">📋 我的 Workers</div>
        <button class="btn btn-outline" onclick="loadWorkers()" style="padding:4px 14px;font-size:12px;">🔄 刷新</button>
      </div>
      <div id="workerList" class="worker-list"><div class="loading">⏳ 加载中...</div></div>
    </div>

    <!-- 代码编辑器 -->
    <div class="card editor-area hidden" id="editorCard">
      <div class="flex-between">
        <div class="info" id="editorInfo">📄 未选择文件</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-success" id="saveBtn" onclick="saveWorker()" style="padding:6px 16px;font-size:13px;">💾 保存</button>
          <button class="btn btn-outline" onclick="closeEditor()" style="padding:6px 16px;font-size:13px;">✕ 关闭</button>
        </div>
      </div>
      <textarea id="codeEditor" placeholder="选择一个 Worker 查看代码..."></textarea>
      <div style="margin-top:8px;font-size:12px;color:#555;">提示：修改后点击「保存」即可部署</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 配置
// ============================================================
// 这是你的 Cloudflare OAuth 客户端信息
// 使用公共客户端，无需密钥
const CLIENT_ID = 'e76fd3b6-2dde-4df6-986c-7a2fe869acbb'; // Cloudflare 公共 OAuth 客户端
const REDIRECT_URI = window.location.origin + window.location.pathname;

// ============================================================
// 状态管理
// ============================================================
let accessToken = null;
let accountId = null;
let currentWorker = null;

// ============================================================
// 登录
// ============================================================
function login() {
  // 生成随机 state 防 CSRF
  const state = crypto.randomUUID();
  localStorage.setItem('oauth_state', state);

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'code',
    scope: 'openid email profile',
    state: state,
  });

  window.location.href = `https://dash.cloudflare.com/oauth2/authorize?${params}`;
}

// ============================================================
// 处理 OAuth 回调
// ============================================================
async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const savedState = localStorage.getItem('oauth_state');

  if (!code) return;

  // 验证 state
  if (state !== savedState) {
    showToast('❌ 授权验证失败', 'error');
    return;
  }

  // 清除 URL 参数
  window.history.replaceState({}, document.title, window.location.pathname);

  // 用 code 换取 access_token
  try {
    showToast('⏳ 正在登录...', '');
    const res = await fetch('https://dash.cloudflare.com/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_id: CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        grant_type: 'authorization_code',
        code: code,
      }),
    });
    const data = await res.json();
    if (data.access_token) {
      accessToken = data.access_token;
      localStorage.setItem('cf_access_token', accessToken);
      showToast('✅ 登录成功', 'success');
      await loadAccount();
      await loadWorkers();
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('mainPanel').classList.remove('hidden');
      document.getElementById('logoutBtn').style.display = 'inline-block';
    } else {
      showToast('❌ 登录失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('❌ 登录失败: ' + e.message, 'error');
  }
}

// ============================================================
// 获取账号信息
// ============================================================
async function loadAccount() {
  try {
    const res = await fetch('https://api.cloudflare.com/client/v4/user', {
      headers: { 'Authorization': `Bearer ${accessToken}` },
    });
    const data = await res.json();
    if (data.success && data.result) {
      accountId = data.result.id;
      // 获取第一个账号的 ID（用于 Workers API）
      const accRes = await fetch('https://api.cloudflare.com/client/v4/accounts', {
        headers: { 'Authorization': `Bearer ${accessToken}` },
      });
      const accData = await accRes.json();
      if (accData.success && accData.result.length > 0) {
        accountId = accData.result[0].id;
      }
    }
  } catch (e) {
    showToast('❌ 获取账号信息失败', 'error');
  }
}

// ============================================================
// 加载 Worker 列表
// ============================================================
async function loadWorkers() {
  const container = document.getElementById('workerList');
  container.innerHTML = '<div class="loading">⏳ 加载中...</div>';

  if (!accessToken) {
    container.innerHTML = '<div class="loading">❌ 未登录</div>';
    return;
  }

  try {
    const res = await fetch(
      `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts`,
      { headers: { 'Authorization': `Bearer ${accessToken}` } }
    );
    const data = await res.json();
    if (data.success && data.result) {
      const scripts = data.result;
      if (scripts.length === 0) {
        container.innerHTML = '<div class="loading">📭 暂无 Worker</div>';
        return;
      }
      let html = '';
      scripts.forEach(s => {
        const name = s.id || s.script_name || s.name || '未命名';
        html += `
          <div class="worker-item" onclick="openWorker('${name}')">
            <span class="name">⚡ ${name}</span>
            <span class="badge">点击编辑</span>
          </div>
        `;
      });
      container.innerHTML = html;
    } else {
      container.innerHTML = '<div class="loading">❌ 加载失败: ' + (data.errors?.[0]?.message || '未知错误') + '</div>';
    }
  } catch (e) {
    container.innerHTML = '<div class="loading">❌ 加载失败: ' + e.message + '</div>';
  }
}

// ============================================================
// 打开 Worker 编辑
// ============================================================
async function openWorker(name) {
  currentWorker = name;
  const editor = document.getElementById('codeEditor');
  const info = document.getElementById('editorInfo');
  const card = document.getElementById('editorCard');

  info.textContent = `📄 正在加载: ${name}`;
  editor.value = '⏳ 加载中...';
  card.classList.remove('hidden');

  try {
    const res = await fetch(
      `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/${name}`,
      {
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Accept': 'application/json',
        },
      }
    );
    const data = await res.json();
    if (data.success && data.result) {
      // Worker 代码在 result.script 或 result.parts 中
      let code = data.result.script || data.result.parts?.[0]?.script || '';
      // 如果是 base64 编码，解码
      if (code && typeof code === 'string' && code.startsWith('data:application/json;base64,')) {
        try {
          const base64 = code.split(',')[1];
          const decoded = atob(base64);
          const json = JSON.parse(decoded);
          code = json.script || '';
        } catch (e) {}
      }
      editor.value = code || '// 代码为空';
      info.textContent = `📄 正在编辑: ${name}`;
      document.getElementById('saveBtn').style.display = 'inline-block';
      showToast('✅ 已加载 ' + name, 'success');
    } else {
      // 如果 API 获取失败，尝试用原始方式
      const rawRes = await fetch(
        `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/${name}/content`,
        {
          headers: {
            'Authorization': `Bearer ${accessToken}`,
          },
        }
      );
      if (rawRes.ok) {
        const text = await rawRes.text();
        editor.value = text;
        info.textContent = `📄 正在编辑: ${name}`;
        document.getElementById('saveBtn').style.display = 'inline-block';
      } else {
        editor.value = '// 无法加载代码\n// 你可能没有查看此 Worker 的权限';
        info.textContent = `❌ 加载失败: ${name}`;
        document.getElementById('saveBtn').style.display = 'none';
      }
    }
  } catch (e) {
    editor.value = '// 加载失败: ' + e.message;
    info.textContent = `❌ 加载失败: ${name}`;
  }
}

// ============================================================
// 保存 Worker
// ============================================================
async function saveWorker() {
  if (!currentWorker) return;

  const code = document.getElementById('codeEditor').value;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 保存中...';

  try {
    const res = await fetch(
      `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/${currentWorker}`,
      {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/javascript',
        },
        body: code,
      }
    );
    const data = await res.json();
    if (data.success) {
      showToast('✅ 保存成功！已部署', 'success');
    } else {
      showToast('❌ 保存失败: ' + (data.errors?.[0]?.message || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('❌ 保存失败: ' + e.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = '💾 保存';
}

// ============================================================
// 关闭编辑器
// ============================================================
function closeEditor() {
  document.getElementById('editorCard').classList.add('hidden');
  currentWorker = null;
}

// ============================================================
// 退出登录
// ============================================================
function logout() {
  accessToken = null;
  localStorage.removeItem('cf_access_token');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('mainPanel').classList.add('hidden');
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('workerList').innerHTML = '<div class="loading">📭 请登录</div>';
  closeEditor();
  showToast('👋 已退出', '');
}

// ============================================================
// Toast
// ============================================================
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

// ============================================================
// 检查是否有保存的 Token
// ============================================================
function checkSavedToken() {
  const saved = localStorage.getItem('cf_access_token');
  if (saved) {
    accessToken = saved;
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('mainPanel').classList.remove('hidden');
    document.getElementById('logoutBtn').style.display = 'inline-block';
    loadAccount().then(() => loadWorkers());
    showToast('✅ 已恢复登录', 'success');
  }
}

// ============================================================
// 启动
// ============================================================
if (window.location.search.includes('code=')) {
  handleCallback();
} else {
  checkSavedToken();
}
</script>
</body>
</html>
