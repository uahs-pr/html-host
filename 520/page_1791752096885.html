<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐搜索本地页｜iv.koy.dpdns.org</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            margin-bottom:20px;
        }
        .search-box {
            display: flex;
            gap:10px;
            margin-bottom:30px;
        }
        #keyword {
            flex:1;
            padding:14px 16px;
            border-radius:12px;
            border:none;
            font-size:16px;
            outline:none;
        }
        #searchBtn {
            padding:14px 24px;
            border-radius:12px;
            border:none;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.2s;
        }
        #searchBtn:disabled{
            background:#334155;
            cursor:not-allowed;
        }
        .song-item{
            background:#1e293b;
            border-radius:14px;
            padding:16px;
            margin-bottom:12px;
            cursor:pointer;
        }
        .song-item:active{
            opacity:0.8;
        }
        .song-top{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .cover-img{
            width:60px;
            height:60px;
            border-radius:8px;
            object-fit:cover;
            background:#334155;
        }
        .song-name{
            font-size:17px;
            font-weight:bold;
            margin-bottom:6px;
        }
        .song-info{
            color:#94a3b8;
            font-size:14px;
        }
        .loading{
            text-align:center;
            padding:30px;
            color:#cbd5e1;
        }
        audio{
            width:100%;
            margin:20px 0;
        }
    </style>
</head>
<body>
    <h2>音乐搜索测试（本地HTML）</h2>
    <div class="search-box">
        <input type="text" id="keyword" placeholder="输入歌曲名，例如：晴天">
        <button id="searchBtn">搜索</button>
    </div>
    <audio id="player" controls>
    <div id="resultBox"></div>

<script>
const API_URL = "https://iv.koy.dpdns.org";
const keywordInput = document.getElementById('keyword');
const searchBtn = document.getElementById('searchBtn');
const resultBox = document.getElementById('resultBox');
const player = document.getElementById('player');

async function doSearch(){
    const kw = keywordInput.value.trim();
    if(!kw){
        alert("请输入歌曲名称");
        return;
    }
    searchBtn.disabled = true;
    resultBox.innerHTML = `<div class="loading">正在搜索...</div>`;

    try{
        const res = await fetch(`${API_URL}?act=search&keyword=${encodeURIComponent(kw)}&platform=kuwo&page=1&size=20`);
        const json = await res.json();

        if(json.code !== 0 || !json.data || !json.data.list){
            resultBox.innerHTML = `<div class="loading">未找到歌曲，返回信息：${JSON.stringify(json)}</div>`;
            searchBtn.disabled = false;
            return;
        }

        let html = "";
        json.data.list.forEach(song=>{
            html += `
            <div class="song-item" data-id="${song.id}" data-sign="${song.sign}">
                <div class="song-top">
                    <img class="cover-img" src="${song.pic || ''}" alt="封面">
                    <div>
                        <div class="song-name">${song.name}</div>
                        <div class="song-info">歌手：${song.artist}</div>
                        <div class="song-info">专辑：${song.album_name || '-'}</div>
                    </div>
                </div>
            </div>
            `
        })
        resultBox.innerHTML = html;

        // 点击卡片拉取播放链接并播放
        document.querySelectorAll(".song-item").forEach(el=>{
            el.onclick = async ()=>{
                const sid = el.dataset.id;
                const ssign = el.dataset.sign;
                el.innerHTML = `<div class="loading">正在获取播放地址...</div>`;
                const playRes = await fetch(`${API_URL}?act=url&id=${sid}&sign=${ssign}&quality=flac`);
                const playJson = await playRes.json();
                if(playJson.code === 0 && playJson.data && playJson.data.url){
                    player.src = playJson.data.url;
                    player.play();
                }else{
                    alert("获取播放链接失败");
                }
                // 恢复卡片原始内容，这里简化，你可以完善
                location.reload();
            }
        })
    }catch(err){
        resultBox.innerHTML = `<div class="loading">请求出错：${err.message}</div>`
    }
    searchBtn.disabled = false;
}

searchBtn.addEventListener('click',doSearch);
keywordInput.addEventListener('keydown',(e)=>{
    if(e.key === 'Enter') doSearch();
})
</script>
</body>
</html>
