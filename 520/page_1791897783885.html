<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终测试</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 15px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #fff; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        /* 图片长宽固定，方便看报错 */
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; background: #eee; }
        .card h3 { font-size: 14px; margin: 10px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card p { font-size: 12px; color: #888; margin: 0 0 10px; }
        .btn { display: block; background: #007bff; color: #fff; text-decoration: none; padding: 8px; border-radius: 5px; font-size: 13px; border: none; width: 100%; cursor: pointer; }
        .btn:active { background: #0056b3; }
        #status { text-align: center; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header" style="text-align: center; margin-bottom: 20px;">
        <h1>游戏大厅</h1>
        <p>纯前端测试（仅供本地学习）</p>
    </div>
    
    <div id="status">正在加载数据...</div>
    <div class="grid" id="gameGrid"></div>

    <script>
        // ==========================================================
        // 👇 请把你刚才抓包填成功的接口地址填在这里 👇
        // ==========================================================
        const API_URL = 'https://n19.akdb.top/api/public/trial-games?page=1&pageSize=30&category=PG%E7%94%B5%E5%AD%90'; 
        const BASE_URL = 'https://n19.akdb.top'; // 用于拼接相对路径的图片

        const statusDiv = document.getElementById('status');
        const gridDiv = document.getElementById('gameGrid');

        fetch(API_URL)
            .then(response => response.json())
            .then(result => {
                const games = result.items || result.data || result;
                if (!Array.isArray(games)) throw new Error('返回格式不是数组');

                statusDiv.style.display = 'none';
                
                games.forEach(game => {
                    const name = game.name || '未知游戏';
                    
                    // 1. 尝试拼接图片完整路径（注意：大概率会被防盗链拦截）
                    let imgUrl = game.imagePath ? (BASE_URL + game.imagePath) : '';
                    
                    // 2. 提取游戏链接（注意：你的数据里 directPlayUrl 是空的！）
                    // 尝试用 trialUrl 或 launchCode 拼接（注意：这是无效的，因为没有签名鉴权）
                    let playUrl = game.directPlayUrl || game.trialUrl || (BASE_URL + '/api/public/play?code=' + game.launchCode);
                    
                    const rtp = game.rtp || '96.9%';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${name}" onerror="this.src='https://via.placeholder.com/150?text=图片被防盗链拦截'">
                        <h3>${name}</h3>
                        <p>RTP: ${rtp}</p>
                        <button class="btn" onclick="handlePlay('${playUrl}', '${name}')">开始试玩</button>
                    `;
                    gridDiv.appendChild(card);
                });
            })
            .catch(error => {
                console.error('请求失败，控制台报错详情：', error);
                statusDiv.innerText = '加载失败！按 F12 打开控制台看红色报错。';
                statusDiv.style.color = 'red';
            });

        // 试玩按钮的点击事件
        function handlePlay(url, name) {
            if (!url || url.includes('code=g_')) {
                alert(`【失败】点击了：${name}。\n原因：你抓到的数据里 directPlayUrl 是空的！你尝试拼凑的 launchCode 没有经过官方签名，服务器根本不认。`);
                return;
            }
            // 如果有了真实的 URL，尝试打开
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
