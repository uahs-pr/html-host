lyricModal.onclick = (e) => { if (e.target === lyricModal) lyricModal.classList.remove("show"); };

async function fetchLyric(id, source) { try { const url = `${API_BASE}?types=lyric&source=${source}&id=${id}`; const res = await fetch(url); const data = await res.json(); return data.lyric || data || "暂无歌词"; } catch (e) { return "歌词加载失败: " + e.message; } }

function parseLrc(text) { if (!text || text === '暂无歌词' || text === '歌词加载失败') return []; const lines = text.split('\n'); const result = []; const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/; lines.forEach(line => { const match = timeReg.exec(line); if (match) { const time = parseInt(match[1])*60 + parseInt(match[2]) + parseInt(match[3].padEnd(3,'0'))/1000; const text = line.replace(timeReg, '').trim(); if (text) result.push({ time, text }); } }); return result.sort((a, b) => a.time - b.time); }
function displayLyric(text) { parsedLyrics = parseLrc(text); lastActiveLyricIndex = -1; if (parsedLyrics.length === 0) { lyricContent.innerHTML = `<div>${text || '暂无歌词'}</div>`; return; } lyricContent.innerHTML = parsedLyrics.map((item, index) => `<div data-index="${index}">${item.text}</div>`).join(''); }

function updateLyricHighlight(currentTime) {
  if (parsedLyrics.length === 0 || !lyricModal.classList.contains('show')) return;
  let activeIndex = -1;
  for (let i = 0; i < parsedLyrics.length; i++) { if (currentTime >= parsedLyrics[i].time) activeIndex = i; else break; }
  if (activeIndex !== lastActiveLyricIndex && activeIndex !== -1) {
    lastActiveLyricIndex = activeIndex;
    const allLines = lyricContent.querySelectorAll('div');
    allLines.forEach((line, idx) => line.classList.toggle('active', idx === activeIndex));
    const activeLine = allLines[activeIndex]; if (activeLine) activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

modeBtn.onclick = () => { playMode = (playMode + 1) % 3; modeBtn.innerText = modeIcons[playMode]; modeBtn.title = modeTitles[playMode]; playerEl.loop = (playMode === 1); alert("已切换为：" + modeTitles[playMode]); };

function formatTime(seconds) { if (isNaN(seconds) || seconds === Infinity) return "0:00"; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return m + ":" + (s < 10 ? "0" : "") + s; }
function showLoading(text) { loadText.textContent = text || "加载中..."; loadingIndicator.classList.add("show"); }
function hideLoading() { loadingIndicator.classList.remove("show"); }

async function playSong(item, list) {
  if (!item || !item.id) return;
  if (list) currentPlaylist = list;
  currentIndex = currentPlaylist.findIndex(s => s.id === item.id);
  showLoading("正在获取播放地址: " + item.name);
  nowTitle.innerText = item.name;
  audioWrap.classList.add("show", "playing");
  speedSelect.value = "1"; playerEl.playbackRate = 1;
  try {
    const br = qualitySelect.value; 
    const url = `${API_BASE}?types=url&source=${currentSource}&id=${item.id}&br=${br}`;
    const res = await fetch(url); const data = await res.json();
    if (!data.url) { hideLoading(); alert("获取播放地址失败，可能是VIP/版权受限歌曲！"); return; }
    playerEl.src = data.url; playerEl.load();
    playerEl.oncanplay = function() { hideLoading(); playerEl.play().catch(err => console.log("自动播放被拦截：", err)); miniBall.style.display = "none"; miniBall.classList.remove("playing"); playerEl.oncanplay = null; };
    playerEl.onerror = function() { hideLoading(); alert("歌曲加载失败，请切歌后重试"); playerEl.onerror = null; };
    if (lyricModal.classList.contains('show')) { lyricBtn.click(); }
  } catch (e) { hideLoading(); alert("网络请求失败：" + e.message); }
}

function playByIndex(index) { if (index < 0 || index >= currentPlaylist.length) return; const item = currentPlaylist[index]; playSong(item, currentPlaylist); }

minimizeBtn.onclick = () => { audioWrap.classList.remove("show"); miniBall.style.display = "flex"; if (!playerEl.paused) miniBall.classList.add("playing"); };
miniBall.onclick = () => { miniBall.style.display = "none"; miniBall.classList.remove("playing"); audioWrap.classList.add("show"); };

playBtn.onclick = () => { if (playerEl.paused) { if (!playerEl.src || playerEl.ended) { if (currentPlaylist.length > 0 && currentIndex >= 0) playSong(currentPlaylist[currentIndex], currentPlaylist); return; } playerEl.play().catch(err => console.log(err)); } else { playerEl.pause(); } };
prevBtn.onclick = () => playByIndex(currentIndex - 1);
nextBtn.onclick = () => playByIndex(currentIndex + 1);
closePlayer.onclick = () => { playerEl.pause(); audioWrap.classList.remove("show", "playing"); miniBall.style.display = "none"; miniBall.classList.remove("playing"); hideLoading(); };

playerEl.addEventListener('play', () => { audioWrap.classList.add("show", "playing"); playBtn.textContent = "⏸"; if (miniBall.style.display !== "none") miniBall.classList.add("playing"); });
playerEl.addEventListener('pause', () => { playBtn.textContent = "▶"; miniBall.classList.remove("playing"); });

playerEl.addEventListener('ended', () => {
  playBtn.textContent = "▶"; miniBall.classList.remove("playing");
  let nextIndex = currentIndex + 1;
  if (playMode === 2) { if (currentPlaylist.length > 1) { do { nextIndex = Math.floor(Math.random() * currentPlaylist.length); } while (nextIndex === currentIndex); } else { nextIndex = 0; } } 
  else { if (nextIndex >= currentPlaylist.length) nextIndex = 0; }
  setTimeout(() => playByIndex(nextIndex), 500);
});

playerEl.addEventListener('timeupdate', () => { if (isDragging) return; const pct = playerEl.duration ? (playerEl.currentTime / playerEl.duration) * 100 : 0; progressFill.style.width = pct + "%"; currentTimeEl.textContent = formatTime(playerEl.currentTime); updateLyricHighlight(playerEl.currentTime); });
playerEl.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(playerEl.duration); });

// ====== 🎯 终极修复进度条拖拽（手机触摸 + 电脑鼠标兼容） ======
let progressRect = null;

function handleProgressStart(e) {
  isDragging = true;
  // 一次性锁定进度条的坐标，避免因为页面滚动导致坐标变化
  progressRect = progressBar.getBoundingClientRect();
  handleProgressMove(e);

  // 同时绑定手机 touchmove 和电脑 mousemove
  document.addEventListener('touchmove', handleProgressMove, { passive: false });
  document.addEventListener('mousemove', handleProgressMove);
  document.addEventListener('touchend', handleProgressEnd);
  document.addEventListener('mouseup', handleProgressEnd);
}

function handleProgressMove(e) {
  if (!isDragging || !progressRect) return;
  if (e.cancelable) e.preventDefault(); // 阻止页面滚动
  
  // 获取坐标（兼容触摸和鼠标）
  const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
  const x = (clientX - progressRect.left) / progressRect.width;
  const pct = Math.min(1, Math.max(0, x));

  // 视觉更新
  progressFill.style.width = (pct * 100) + "%";
  if (playerEl.duration) {
    const time = pct * playerEl.duration;
    currentTimeEl.textContent = formatTime(time);
    // 拖拽时实时同步歌词！
    updateLyricHighlight(time);
  }
}

function handleProgressEnd(e) {
  if (!isDragging) return;
  isDragging = false;

  // 计算最终位置
  const clientX = e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0].clientX : e.clientX;
  const x = (clientX - progressRect.left) / progressRect.width;
  const pct = Math.min(1, Math.max(0, x));

  if (playerEl.duration) {
    playerEl.currentTime = pct * playerEl.duration;
    // 松手后立刻修正一次歌词高亮
    updateLyricHighlight(playerEl.currentTime);
  }

  // 清理
  progressRect = null;
  document.removeEventListener('touchmove', handleProgressMove);
  document.removeEventListener('mousemove', handleProgressMove);
  document.removeEventListener('touchend', handleProgressEnd);
  document.removeEventListener('mouseup', handleProgressEnd);
}

// 绑定启动事件（同时支持触摸和鼠标）
progressBar.addEventListener('touchstart', handleProgressStart, { passive: false });
progressBar.addEventListener('mousedown', handleProgressStart);

// ====== 搜索音乐 ======
async function searchMusic(keyword) {
  loadingEl.style.display = "block"; errorBox.style.display = "none"; emptyBox.style.display = "none"; countTip.innerText = "正在搜索...";
  try {
    const url = `${API_BASE}?types=search&source=${currentSource}&name=${encodeURIComponent(keyword)}&count=50`;
    const res = await fetch(url); const data = await res.json(); loadingEl.style.display = "none";
    if (Array.isArray(data) && data.length > 0) {
      allSongList = data.map(song => ({ id: song.id, name: song.name, artist: Array.isArray(song.artist) ? song.artist.join('/') : (song.artist || '未知'), album: song.album || '', pic_id: song.pic_id, lyric_id: song.lyric_id }));
      currentList = allSongList; currentPage = 1; renderUI(currentList);
    } else { allSongList = []; currentList = []; emptyBox.style.display = "block"; emptyBox.innerText = "没有找到相关歌曲，请换个歌词或歌名试试"; countTip.innerText = ""; listWrap.innerHTML = ""; }
  } catch (e) { loadingEl.style.display = "none"; errorBox.style.display = "block"; errorBox.innerText = "搜索失败：" + e.message; }
}

function renderUI(arr) {
  listWrap.innerHTML = ""; emptyBox.style.display = "none"; errorBox.style.display = "none";
  if (!arr || arr.length === 0) { emptyBox.style.display = "block"; countTip.innerText = ""; pageInfo.innerText = "0 / 0"; return; }
  const total = arr.length; const totalPages = Math.ceil(total / pageSize); if (currentPage > totalPages) currentPage = totalPages; if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * pageSize; const end = Math.min(start + pageSize, total); const pageData = arr.slice(start, end);
  countTip.innerText = `共 ${total} 首歌曲`; pageInfo.innerText = `${currentPage} / ${totalPages}`;
  pageData.forEach((item, idx) => {
    const div = document.createElement("div"); div.className = "card music-item";
    const imgId = `cover_${start + idx}`;
    div.innerHTML = `<img id="${imgId}" style="display:none;" referrerpolicy="no-referrer"><div style="flex:1;min-width:0;overflow:hidden;"><div class="music-song-title">${item.name}</div><div class="music-play-text">🎵 ${item.artist} · 点击播放</div></div>`;
    div.onclick = () => { const fullList = arr; playSong(item, fullList); };
    listWrap.appendChild(div);
    if (item.pic_id) { fetch(`${API_BASE}?types=pic&source=${currentSource}&id=${item.pic_id}&size=300`).then(res => res.json()).then(data => { if (data && data.url) { const imgEl = document.getElementById(imgId); if (imgEl) { imgEl.src = data.url; imgEl.style.display = "block"; } } }).catch(err => console.log("图片加载失败:", err)); }
  });
}

function searchSong() { const keyword = searchInput.value.trim(); if (!keyword) return alert("请输入歌词或歌曲名"); searchMusic(keyword); }
searchBtn.onclick = searchSong; searchInput.addEventListener("keydown", e => { if(e.key === "Enter") searchSong(); });

prevBtnPage.onclick = () => { if (currentPage > 1) { currentPage--; renderUI(currentList); } };
nextBtnPage.onclick = () => { if (currentPage < Math.ceil(currentList.length / pageSize)) { currentPage++; renderUI(currentList); } };

listWrap.innerHTML = '<div class="music-empty" style="display:block;">🎵 请输入歌词或歌曲名进行搜索</div>';
countTip.innerText = ""; pageInfo.innerText = "1 / 1";

// ====== 粒子效果 ======
const canvas = document.createElement("canvas"); canvas.id = "particleCanvas"; document.body.prepend(canvas);
const ctx = canvas.getContext("2d"); let particles = []; const PARTICLE_COUNT = 65; const MAX_DISTANCE = 120;
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener("resize", resizeCanvas);
for(let i = 0; i < PARTICLE_COUNT; i++){ particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.45, vy: (Math.random() - 0.5) * 0.45 }); }
function animateParticles(){ ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > canvas.width) p.vx *= -1; if(p.y < 0 || p.y > canvas.height) p.vy *= -1; }); for(let i = 0; i < particles.length; i++){ for(let j = i + 1; j < particles.length; j++){ const p1 = particles[i]; const p2 = particles[j]; const dx = p1.x - p2.x; const dy = p1.y - p2.y; const distance = Math.sqrt(dx * dx + dy * dy); if(distance < MAX_DISTANCE){ const opacity = (1 - distance / MAX_DISTANCE) * 0.35; ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.strokeStyle = "rgba(80,150,240," + opacity + ")"; ctx.lineWidth = 0.7; ctx.stroke(); } } } particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = "rgba(70,145,240,0.7)"; ctx.fill(); }); requestAnimationFrame(animateParticles); }
animateParticles();
</script>
