// 自动解密
(function(){
  try{
    var salt = CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.s);
    var iv = CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.i);
    var key = CryptoJS.PBKDF2("https://12345.txqkk.com", salt, {
      keySize: 256/32,
      iterations: 100000,
      hasher: CryptoJS.algo.SHA256
    });
    var cipherParams = CryptoJS.lib.CipherParams.create({
      ciphertext: CryptoJS.enc.Base64.parse(ENCRYPTED_DATA.d)
    });
    var decrypted = CryptoJS.AES.decrypt(cipherParams, key, {
      iv: iv,
      mode: CryptoJS.mode.CBC,
      padding: CryptoJS.pad.Pkcs7
    });
    var raw = decrypted.toString(CryptoJS.enc.Utf8);
    if(!raw) throw new Error('解密失败');
    
    // 渲染页面
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = raw;
    var scripts = tempDiv.querySelectorAll('script');
    var scriptContents = [];
    scripts.forEach(function(s){
      scriptContents.push(s.textContent || s.innerHTML || '');
      s.parentNode && s.parentNode.removeChild(s);
    });
    var appDiv = document.getElementById('app');
    appDiv.innerHTML = tempDiv.innerHTML;
    appDiv.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    scriptContents.forEach(function(code){
      if(code.trim()){
        try{
          var globalEval = eval;
          globalEval(code);
        }catch(e){}
      }
    });
  }catch(e){
    document.getElementById('loading').innerText = '解密失败：' + e.message;
  }
})();
</script>
