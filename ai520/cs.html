
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ音乐播放器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui}
body{
  background:#f3f0fc;
  background-image: radial-gradient(#d8cfff 1px,transparent 1px);
  background-size:24px 24px;
  padding:20px 16px;
  max-width:720px;
  margin:0 auto;
  padding-bottom:140px;
}

/* 搜索框 */
.search-wrap{
  display:flex;
  gap:12px;
  margin-bottom:28px;
}
.search-input{
  flex:1;
  padding:14px 18px;
  border-radius:999px;
  border:none;
  font-size:16px;
  background:#ffffffdd;
  box-shadow:0 2px 8px #00000015;
  outline:none;
}
.search-btn{
  padding:0 28px;
  border-radius:999px;
  border:none;
  background:linear-gradient(135deg,#8b5cf6,#a855f7);
  color:white;
  font-size:16px;
  font-weight:500;
  cursor:pointer;
}

.card{
  background:#ffffffdd;
  border-radius:22px;
  padding:22px 18px;
  box-shadow:0 4px 16px #00000012;
}

/* 歌单卡片左上角数量 */
.card-count{
  color:#6b5b95;
  font-size:14px;
  font-weight:500;
  margin-bottom:18px;
  padding-left:4px;
}

/* 歌曲列表项 */
.item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid #efe9ff;
}
.item:last-child{
  border-bottom:none;
}
.num{
  width:36px;
  text-align:center;
  font-size:20px;
  font-weight:500;
  color:#6b5b95;
}
.icon-box{
  width:56px;height:56px;
  border-radius:14px;
  background:linear-gradient(135deg,#8b5cf6,#a855f7);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  flex-shrink:0;
}
.info{
  flex:1;
  min-width:0;
  overflow:hidden;
}

/* 修复：全部固定字号、行高，字体大小统一 */
.song-name{
  font-size:13px !important;
  line-height:1.4;
  color:#2d2440;
  overflow:hidden;
  white-space:nowrap;
  position:relative;
}
.song-name span{
  display:inline-block;
}
/* 只有内容溢出才执行跑马灯，速度12秒 */
.song-name.marquee span{
  animation:marquee 12s linear infinite;
  padding-left:100%;
}
@keyframes marquee{
  0%{transform:translateX(0)}
  100%{transform:translateX(-100%)}
}

.play-btn{
  width:56px;height:56px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#8b5cf6,#a855f7);
  color:white;
  font-size:22px;
  flex-shrink:0;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:40px 0;
  color:#8879a8;
}
.error{
  color:#c026d3;
  padding:16px;
  text-align:center;
}
.empty{
  text-align:center;
  padding:30px 0;
  color:#8879a8;
}

/* 底部播放器标题缩小 */
.bottom-player{
  position:fixed;
  left:12px;right:12px;
  bottom:16px;
  background:#ffffffee;
  backdrop-filter:blur(10px);
  border-radius:16px;
  padding:12px 16px;
  box-shadow:0 4px 20px #00000020;
  max-width:680px;
  margin:0 auto;
}
.bottom-player h4{
  color:#4b3b70;
  margin-bottom:8px;
  overflow:hidden;
  white-space:nowrap;
  font-size:14px;
}
audio{
  width:100%;
}
</style>
</head>
<body>

<div class="search-wrap">
  <input class="search-input" id="searchInput" placeholder="搜索歌曲、歌手或DJ">
  <button class="search-btn" id="searchBtn">搜索</button>
</div>

<div class="card">
  <div class="card-count" id="cardCount">共 0 首歌曲</div>
  <div id="loading" class="loading">正在加载歌单……</div>
  <div id="errorBox" class="error" style="display:none"></div>
  <div id="emptyBox" class="empty" style="display:none">没有找到相关歌曲</div>
  <div id="listWrap"></div>
</div>

<!-- 底部悬浮播放器 -->
<div class="bottom-player">
  <h4 id="nowTitle">请选择歌曲播放</h4>
  <audio id="player" controls></audio>
</div>

<script>
const WORKER_BASE = "https://yw.vyle.eu.cc";

const playerEl = document.getElementById("player");
const nowTitle = document.getElementById("nowTitle");
const listWrap = document.getElementById("listWrap");
const loadingEl = document.getElementById("loading");
const errorBox = document.getElementById("errorBox");
const emptyBox = document.getElementById("emptyBox");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const cardCount = document.getElementById("cardCount");

let allSongList = [];
let currentList = [];

function showError(msg){
  loadingEl.style.display="none";
  errorBox.style.display="block";
  errorBox.innerText=msg;
}

function showEmpty(){
  loadingEl.style.display="none";
  emptyBox.style.display="block";
  listWrap.innerHTML="";
  cardCount.innerText = "共 0 首歌曲";
}

async function loadAllList(){
  try{
    const res = await fetch(`${WORKER_BASE}/api/dj?page=1&size=1000`);
    if(!res.ok) throw new Error("接口异常 "+res.status);
    const json = await res.json();
    loadingEl.style.display="none";

    if(!json.data || !Array.isArray(json.data)){
      showError("接口数据格式错误");
      return;
    }

    allSongList = json.data;
    currentList = allSongList;
    renderUI(currentList);
  }catch(e){
    showError(e.message);
  }
}

function renderUI(arr){
  listWrap.innerHTML="";

  if(arr.length===0){
    showEmpty();
    return;
  }

  cardCount.innerText = `共 ${arr.length} 首歌曲`;

  arr.forEach((item,idx)=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <div class="num">${idx+1}</div>
      <div class="icon-box">♪</div>
      <div class="info">
        <div class="song-name"><span>${item.name}</span></div>
      </div>
      <button class="play-btn">▶</button>
    `;

    // 判断文字是否溢出，只有太长才加上跑马灯class
    const nameDom = div.querySelector('.song-name');
    setTimeout(()=>{
      if(nameDom.scrollWidth > nameDom.clientWidth){
        nameDom.classList.add('marquee');
      }
    },10)

    div.querySelector(".play-btn").onclick=()=>{
      playSong(item);
    };

    listWrap.appendChild(div);
  });
}

function playSong(item){
  nowTitle.innerText = item.name;
  playerEl.src = item.audio;
  playerEl.play().catch(err=>console.log(err));
}

function searchSong(){
  const keyword = searchInput.value.trim().toLowerCase();

  if(!keyword){
    currentList = allSongList;
    renderUI(currentList);
    cardCount.innerText = `共 ${allSongList.length} 首歌曲`;
    return;
  }

  currentList = allSongList.filter(item=>
    item.name.toLowerCase().includes(keyword)
  );

  renderUI(currentList);

  if(currentList.length > 0){
    cardCount.innerText = `已找到 ${currentList.length} 首歌曲`;
  }else{
    cardCount.innerText = "共 0 首歌曲";
  }
}

searchBtn.onclick = searchSong;
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") searchSong();
});

loadAllList();
</script>
</body>
</html>
