});

function getRealCountdown() {
    const now = Math.floor(Date.now() / 1000);
    const mod = now % PERIOD_SECONDS;
    return PERIOD_SECONDS - mod;
}

function formatCountdown(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startSyncCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    const cdDom = document.getElementById("countdown");
    function update() {
        const left = getRealCountdown();
        if (left <= 0) {
            cdDom.textContent = "已开奖";
            loadLotteryData();
            return;
        }
        cdDom.textContent = formatCountdown(left);
    }
    update();
    countdownTimer = setInterval(update, 1000);
}

async function loadLotteryData() {
    try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (!json.data || !Array.isArray(json.data)) {resetResult();return;}
        
        lotteryData = json.data.map(item => {
            const codes = item.opencode.split(",");
            const a = Number(codes[0]||0), b=Number(codes[1]||0), c=Number(codes[2]||0);
            const sum = a+b+c;
            return {
                nbr: item.expect,
                number: `${a}+${b}+${c}`,
                num: sum,
                combination: getComboByNum(sum)
            };
        });
        
        updateLatestInfo();
        startSyncCountdown();

        if (lotteryData.length >= 3) {
            const killCombo = calcKillGroup(lotteryData[2], lotteryData[1], lotteryData[0]);
            const finalPredCombo = calcFinalPred(lotteryData[2], lotteryData[1], lotteryData[0], killCombo);
            if (!fixedPredNums) fixedPredNums = generateFixedNums(finalPredCombo);
            document.getElementById("kill-result").textContent = killCombo;
            updatePredComboHtml(finalPredCombo);
            document.getElementById("num-list").innerHTML = fixedPredNums.map(num => `<div class="num-item">${num}</div>`).join('');
        } else resetResult();
        renderHistoryTable();
    } catch (e) {
        console.error("数据拉取失败：", e);
        resetResult();
    }
}

function resetResult() {
    document.getElementById("kill-result").textContent = "数据不足";
    updatePredComboHtml("数据不足 数据不足");
    document.getElementById("num-list").innerHTML = Array(5).fill('<div class="num-item">--</div>').join('');
    fixedPredNums = null;
}

function updateLatestInfo() {
    if (!lotteryData.length) return;
    const latest = lotteryData[0];
    document.getElementById("latest-period").textContent = latest.nbr;
    document.getElementById("latest-sum").textContent = latest.num;
    document.getElementById("latest-combo").textContent = latest.combination;
    document.getElementById("latest-number").textContent = latest.number;
}

function calcAlgorithm1(p1, p2, p3) {
    const n1 = p1.number.split("+").map(Number);
    const n2 = p2.number.split("+").map(Number);
    const n3 = p3.number.split("+").map(Number);
    const num1 = n1[0] * 100 + n1[1] * 10 + n1[2];
    const num2 = n2[0] * 100 + n2[1] * 10 + n2[2];
    const num3 = n3[0] * 100 + n3[1] * 10 + n3[2];
    const sum = num1 + num2 + num3;
    const resultNum = sum % 28;
    return getComboByNum(resultNum);
}
function calcAlgorithm2(p1, p2, p3) {
    let total = Number(p1.num) + Number(p2.num) + Number(p3.num);
    while (total > 27) total = Math.floor(total / 3);
    return getComboByNum(total);
}
function calcKillGroup(p1, p2, p3) {
    const n1 = p1.number.split("+").map(Number);
    const n2 = p2.number.split("+").map(Number);
    const n3 = p3.number.split("+").map(Number);
    const c1 = n1[0] + n2[1] + n3[2];
    const c2 = n1[1] + n2[1] + n3[1];
    const c3 = n1[2] + n2[1] + n3[0];
    const total = (c1 % 10) + (c2 % 10) + (c3 % 10);
    return killRules[total] || "未知";
}
function getComboByNum(num) {
    num = Number(num);
    if (comboConfig.大单.includes(num)) return "大单";
    if (comboConfig.大双.includes(num)) return "大双";
    if (comboConfig.小单.includes(num)) return "小单";
    if (comboConfig.小双.includes(num)) return "小双";
    return "未知";
}
function calcFinalPred(p1, p2, p3, killCombo) {
    const c1 = calcAlgorithm1(p1,p2,p3);
    const c2 = calcAlgorithm2(p1,p2,p3);
    const validCombos = [];
    if (c1 !== killCombo && c1 !== "未知") validCombos.push(c1);
    if (c2 !== killCombo && c2 !== "未知" && !validCombos.includes(c2)) validCombos.push(c2);
    while (validCombos.length < 2) {
        if (validCombos.length > 0) {
            const rev = reverseCombo[validCombos[validCombos.length - 1]];
            if (rev !== killCombo && !validCombos.includes(rev)) { validCombos.push(rev); continue; }
        }
        for (const combo of allCombos) { if (combo !== killCombo && !validCombos.includes(combo)) { validCombos.push(combo); break; } }
    }
    return [...new Set(validCombos)].slice(0,2).join(" ");
}
function updatePredComboHtml(comboStr) {
    const predDom = document.getElementById("pred-result");
    if (comboStr.includes("数据不足")) { predDom.innerHTML = '<span class="combo-tag tag-dadan">数据不足</span>'; return; }
    const combos = comboStr.split(" ");
    let html = "";
    combos.forEach(combo => {
        switch(combo) {
            case "大单": html += '<span class="combo-tag tag-dadan">大单</span>'; break;
            case "大双": html += '<span class="combo-tag tag-dashuang">大双</span>'; break;
            case "小单": html += '<span class="combo-tag tag-xiaodan">小单</span>'; break;
            case "小双": html += '<span class="combo-tag tag-xiaoshuang">小双</span>'; break;
            default: html += `<span class="combo-tag tag-dadan">${combo}</span>`;
        }
    });
    predDom.innerHTML = html;
}
function getHistoryComboHtml(comboStr) {
    const combos = comboStr.split(" ");
    let html = "";
    combos.forEach(combo => {
        switch(combo) {
            case "大单": html += '<span class="combo-tag-small tag-dadan">大单</span>'; break;
            case "大双": html += '<span class="combo-tag-small tag-dashuang">大双</span>'; break;
            case "小单": html += '<span class="combo-tag-small tag-xiaodan">小单</span>'; break;
            case "小双": html += '<span class="combo-tag-small tag-xiaoshuang">小双</span>'; break;
            default: html += `<span class="combo-tag-small tag-dadan">${combo}</span>`;
        }
    });
    return html;
}
function generateFixedNums(predCombo) {
    const [comboA, comboB] = predCombo.split(" ").filter(item => item);
    if (!comboA || !comboB) return [0,2,6,14,16];
    const numsA = comboConfig[comboA].slice(0,3);
    const numsB = comboConfig[comboB].slice(0,2);
    return [...numsA,...numsB];
}
function renderHistoryTable() {
    const tbody = document.getElementById("history-table");
    tbody.innerHTML = "";
    let total = 0, correct = 0;
    if (lotteryData.length < 4) {
        tbody.innerHTML = '<tr><td colspan="7" style="color:var(--text-secondary);">数据不足</td></tr>';
        updateStats(0,0); return;
    }
    for (let i=3; i<lotteryData.length; i++) {
        try {
            const p1=lotteryData[i],p2=lotteryData[i-1],p3=lotteryData[i-2];
            const target=lotteryData[i-3];
            const killCombo=calcKillGroup(p1,p2,p3);
            const predCombo=calcFinalPred(p1,p2,p3,killCombo);
            const predNums=generateFixedNums(predCombo);
            const isCorrect=predCombo.includes(target.combination);
            if (isCorrect) correct++; total++;
            const comboHtml=getHistoryComboHtml(predCombo);
            const tr=document.createElement("tr");
            tr.innerHTML = `
                <td>${target.nbr}</td>
                <td>${target.number}</td>
                <td>${target.combination}</td>
                <td>杀${killCombo}</td>
                <td>${comboHtml}</td>
                <td class="num-cell">${predNums.map(num=>`<span>${num}</span>`).join('')}</td>
                <td class="${isCorrect?'correct':'wrong'}">${isCorrect?'正确':'错误'}</td>
            `;
            tbody.appendChild(tr);
        } catch(e){continue;}
    }
    updateStats(total,correct);
}
function updateStats(total, correct) {
    document.getElementById("total-count").textContent = total;
    document.getElementById("correct-count").textContent = correct;
    const accuracy = total>0 ? ((correct/total)*100).toFixed(1) : 0;
    document.getElementById("accuracy").textContent = `${accuracy}%`;
}
window.addEventListener("beforeunload", () => {
    if (countdownTimer) clearInterval(countdownTimer);
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
});
</script>
