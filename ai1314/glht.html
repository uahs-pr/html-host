<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员审核后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, PingFang SC, Microsoft YaHei}
body{
    padding:20px 14px;
    background: linear-gradient(145deg,#eef4ff,#f7f9fc);
    min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto}
.card{
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:22px;
    padding:26px;
    box-shadow:0 8px 30px rgba(20,40,90,0.08);
    margin-bottom:24px;
    border:1px solid rgba(255,255,255,0.7);
    transition:transform 0.24s ease;
}
.card:hover{transform:translateY(-3px)}
.pending-card{border-top:4px solid #4080ff}
.allow-card{border-top:4px solid #00b42a}
h2{
    margin-bottom:22px;
    color:#101828;
    font-size:21px;
    display:flex;
    align-items:center;
    gap:10px;
}
.user-item{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid rgba(0,0,0,0.06);
    gap:12px;
}
.user-item:last-child{border-bottom:none}
.user-info{
    flex:1;
    min-width:0;
}
.uid-text{
    font-size:14px;
    color:#27272a;
    word-break:break-all;
    line-height:1.5;
}
.time-text{
    font-size:12px;
    color:#86909c;
    margin:4px 0 8px;
}
.remark-row{
    display:flex;
    gap:6px;
    align-items:center;
}
.remark-input{
    flex:1;
    padding:6px 10px;
    border:1px solid #d0d5dd;
    border-radius:8px;
    font-size:13px;
    outline:none;
}
.remark-input:focus{
    border-color:#4080ff;
}
.save-remark{
    padding:5px 10px;
    border:none;
    border-radius:8px;
    background:#4080ff;
    color:#fff;
    font-size:12px;
    cursor:pointer;
}
.btn-group{display:flex;gap:8px;flex-shrink:0;margin-top:8px}
.btn-group button{
    padding:9px 16px;
    border:none;
    border-radius:12px;
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:14px;
    transition:all 0.2s ease;
}
.btn-group button:hover{opacity:0.85;transform:scale(1.04)}
.btn-group button:active{transform:scale(0.96)}
.btn-allow{background:linear-gradient(135deg,#00b42a,#36d361)}
.btn-deny{background:linear-gradient(135deg,#f53f3f,#ff7875)}
.btn-revoke{background:linear-gradient(135deg,#ff7d00,#ffab40)}
.empty-tip{
    text-align:center;
    padding:36px 12px;
    color:#86909c;
    font-size:15px;
}
.error-text{color:#f53f3f;font-weight:bold}
.refresh-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    background:linear-gradient(135deg,#165dff,#4080ff);
    color:#fff;
    border:none;
    font-size:17px;
    font-weight:600;
    margin-bottom:14px;
    transition:all 0.24s ease;
    box-shadow:0 6px 20px rgba(22,93,255,0.22);
}
.refresh-btn:hover{opacity:0.92;transform:translateY(-2px)}
.refresh-btn:active{transform:scale(0.98)}
@media(max-width:580px){
    .user-item{flex-direction:column;align-items:flex-start}
    .btn-group{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="wrap">
    <button class="refresh-btn" onclick="getAllList()">🔄 刷新全部列表</button>

    <div class="card pending-card">
        <h2>📩 待审核访客申请列表</h2>
        <div id="pendingBox">
            <div class="empty-tip">加载数据中，请稍候...</div>
        </div>
    </div>

    <div class="card allow-card">
        <h2>✅ 已授权设备列表（永久放行）</h2>
        <div id="allowedBox">
            <div class="empty-tip">加载数据中，请稍候...</div>
        </div>
    </div>
</div>

<script>
const API_BASE = "https://w209512.pythonanywhere.com";
const ADMIN_KEY = "w209588";
const pendingBox = document.getElementById("pendingBox");
const allowedBox = document.getElementById("allowedBox");

// 时间格式化工具
function formatTime(timestamp){
    if(!timestamp) return "暂无时间记录";
    const d = new Date(timestamp);
    const year = d.getFullYear();
    const mon = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    const h = String(d.getHours()).padStart(2,"0");
    const m = String(d.getMinutes()).padStart(2,"0");
    const s = String(d.getSeconds()).padStart(2,"0");
    return `${year}-${mon}-${day} ${h}:${m}:${s}`;
}

async function getAllList(){
    pendingBox.innerHTML = '<div class="empty-tip">加载数据中，请稍候...</div>';
    allowedBox.innerHTML = '<div class="empty-tip">加载数据中，请稍候...</div>';
    try{
        const res = await fetch(`${API_BASE}/admin/allList`,{
            headers:{Authorization:ADMIN_KEY}
        });
        const data = await res.json();
        if(res.status === 403 || data.code === 403){
            pendingBox.innerHTML = '<div class="empty-tip error-text">鉴权失败，请核对管理员密钥</div>';
            return;
        }

        // 渲染待审核列表
        const pending = data.pending || [];
        if(pending.length === 0){
            pendingBox.innerHTML = '<div class="empty-tip">暂无新的访客申请</div>';
        }else{
            pendingBox.innerHTML = "";
            pending.forEach(item=>{
                const uid = item.userId;
                const time = formatTime(item.time);
                const remark = item.remark || "";
                const div = document.createElement("div");
                div.className = "user-item";
                div.innerHTML = `
                    <div class="user-info">
                        <span class="uid-text">设备ID：${uid}</span>
                        <div class="time-text">申请时间：${time}</div>
                        <div class="remark-row">
                            <input class="remark-input" data-uid="${uid}" value="${remark}" placeholder="添加设备备注">
                            <button class="save-remark" data-saveuid="${uid}">保存备注</button>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-allow" data-uid="${uid}" data-act="allow">同意放行</button>
                        <button class="btn-deny" data-uid="${uid}" data-act="deny">拒绝申请</button>
                    </div>
                `;
                pendingBox.appendChild(div);
            })
        }

        // 渲染已授权列表
        const allowed = data.allowed || [];
        if(allowed.length === 0){
            allowedBox.innerHTML = '<div class="empty-tip">暂无已授权设备</div>';
        }else{
            allowedBox.innerHTML = "";
            allowed.forEach(item=>{
                const uid = item.userId;
                const time = formatTime(item.time);
                const remark = item.remark || "";
                const div = document.createElement("div");
                div.className = "user-item";
                div.innerHTML = `
                    <div class="user-info">
                        <span class="uid-text">设备ID：${uid}</span>
                        <div class="time-text">授权时间：${time}</div>
                        <div class="remark-row">
                            <input class="remark-input" data-uid="${uid}" value="${remark}" placeholder="添加设备备注">
                            <button class="save-remark" data-saveuid="${uid}">保存备注</button>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-revoke" data-uid="${uid}" data-act="revoke">撤销使用权</button>
                    </div>
                `;
                allowedBox.appendChild(div);
            })
        }
    }catch(err){
        pendingBox.innerHTML = `<div class="empty-tip error-text">网络请求出错：${err.message}</div>`;
    }
}

// 统一操作点击事件
document.body.onclick = async e=>{
    const btn = e.target;
    // 1. 同意/拒绝/撤销权限
    if(btn.dataset.uid && btn.dataset.act){
        await fetch(`${API_BASE}/admin/operate`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                Authorization:ADMIN_KEY
            },
            body:JSON.stringify({
                userId:btn.dataset.uid,
                action:btn.dataset.act
            })
        })
        getAllList();
        return;
    }
    // 2. 保存备注
    if(btn.dataset.saveuid){
        const targetUid = btn.dataset.saveuid;
        const input = document.querySelector(`.remark-input[data-uid="${targetUid}"]`);
        const remarkVal = input.value.trim();
        await fetch(`${API_BASE}/admin/saveRemark`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                Authorization:ADMIN_KEY
            },
            body:JSON.stringify({
                userId:targetUid,
                remark:remarkVal
            })
        })
        getAllList();
    }
}

getAllList();
</script>
</body>
</html>
